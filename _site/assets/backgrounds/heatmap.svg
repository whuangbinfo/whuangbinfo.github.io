<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="heatmapPattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- A delicate grid of 'expression' cells -->
      <rect x="10" y="10" width="20" height="20" fill="#005f73" opacity="0.1" />
      <rect x="40" y="30" width="15" height="15" fill="#0a9396" opacity="0.15" />
      <rect x="70" y="50" width="25" height_height="25" fill="#94d2bd" opacity="0.1" />
      <rect x="20" y="70" width="30" height="30" fill="#e9d8a6" opacity="0.05" />
      <rect x="60" y="10" width="10" height="10" fill="#ee9b00" opacity="0.1" />
      <circle cx="85" cy="85" r="5" fill="#ca6702" opacity="0=" /> <!-- Hidden element for variety -->
    </pattern>
  </defs>
  
  <style>
    /* Background color adaptation */
    .bg-base { transition: fill 0.5s ease; }
    @media (prefers-color-scheme: light) {
      .bg-base { fill: #ffffff; }
      .heatmap-cell { opacity: 0.15; }
    }
    @media (prefers-color-scheme: dark) {
      .bg-base { fill: #1a1a1a; }
      .heatmap-cell { opacity: 0.3; }
    }
  </style>

  <rect class="bg-base" width="100%" height="100%" />
  <rect width="100%" height="100%" fill="url(#heatmapPattern)" />
</svg>
