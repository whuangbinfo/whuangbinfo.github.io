<button id="darkmode-toggle" aria-label="Toggle dark mode">🌙</button>

<script>
  const toggle = document.getElementById('darkmode-toggle');
  const currentTheme = localStorage.getItem('theme');
  if (currentTheme === 'dark') document.body.classList.add('dark-mode');

  toggle.addEventListener('click', function () {
    document.body.classList.toggle('dark-mode');
    const theme = document.body.classList.contains('dark-mode') ? 'dark' : 'light';
    localStorage.setItem('theme', theme);
  });
</script>

<style>
  #darkmode-toggle {
    position: fixed;
    top: 1rem;
    right: 1rem;
    font-size: 1.3rem;
    background: none;
    border: none;
    cursor: pointer;
    z-index: 9999; /* Ensures the button stays above other elements */
  }

  body.dark-mode {
    background-color: #121212;
    color: #f0f0f0;
  }

  body.dark-mode a {
    color: #9cd9ff;
  }

  /* --- MINIMA THEME HEADER OVERRIDES --- */
  
  /* 1. Make the header background dark */
  body.dark-mode .site-header {
    background-color: #121212 !important;
    border-top-color: #333 !important;
  }

  /* 2. Make the "Winston Huang" title white */
  body.dark-mode .site-title,
  body.dark-mode .site-title:visited {
    color: #ffffff !important;
  }

  /* 3. Make the navigation tabs (About, Research, etc.) white */
  body.dark-mode .site-nav .page-link {
    color: #f0f0f0 !important;
  }

  /* 4. Make the navigation tabs blue on hover */
  body.dark-mode .site-nav .page-link:hover {
    color: #9cd9ff !important;
  }

  /* 5. Make the mobile hamburger menu icon white */
  body.dark-mode .site-nav .menu-icon svg path {
    fill: #f0f0f0 !important;
  }
</style>
