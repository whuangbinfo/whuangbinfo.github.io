<button id="darkmode-toggle" aria-label="Toggle dark mode">🌙</button>

<script>
  const toggle = document.getElementById('darkmode-toggle');
  const currentTheme = localStorage.getItem('theme');
  if (currentTheme === 'dark') document.body.classList.add('dark-mode');

  toggle.addEventListener('click', function () {
    document.body.classList.toggle('dark-mode');
    const theme = document.body.classList.contains('dark-mode') ? 'dark' : 'light';
    localStorage.setItem('theme', theme);
  });
</script>

<style>
  #darkmode-toggle {
    position: fixed;
    top: 1rem;
    right: 1rem;
    font-size: 1.3rem;
    background: none;
    border: none;
    cursor: pointer;
    z-index: 9999;
  }

  /* 1. Base Dark Mode Body Fix */
  body.dark-mode {
    background-color: #121212 !important;
    color: #f0f0f0 !important;
  }

  body.dark-mode a {
    color: #9cd9ff;
  }

  /* 2. Minima Header & Title Fixes */
  body.dark-mode .site-header {
    background-color: #121212 !important;
    border-top-color: #333 !important;
  }

  body.dark-mode .site-title,
  body.dark-mode .site-title:visited,
  body.dark-mode .site-header .site-title {
    color: #ffffff !important;
  }

  /* 3. Navigation Links */
  body.dark-mode .site-nav .page-link {
    color: #f0f0f0 !important;
  }

  body.dark-mode .site-nav .page-link:hover {
    color: #9cd9ff !important;
  }

  /* 4. Mobile Menu Icon */
  body.dark-mode .site-nav .menu-icon svg path {
    fill: #f0f0f0 !important;
  }
  
  /* 5. Icon Inversion (Socials/Logos) */
  body.dark-mode .social-links img, 
  body.dark-mode .footer-col-1 img, 
  body.dark-mode .svg-icon {
    filter: invert(1) brightness(2);
  }

  /* 6. Mobile Responsiveness */
  @media screen and (max-width: 600px) {
    #darkmode-toggle {
      top: 0.8rem;
      right: 3.5rem;
    }
  } 

  /* 7. Optional: Smooth Transition */
  body, .site-header, .site-title, .page-link {
    transition: background-color 0.3s ease, color 0.3s ease;
  }
</style>
